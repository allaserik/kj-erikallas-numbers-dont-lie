server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ndl}
    username: ${DATABASE_USER:ndl}
    password: ${DATABASE_PASSWORD:ndl_password}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  web:
    resources:
      add-mappings: false
  mvc:
    throw-exception-if-no-handler-found: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://kj-ea-ndl.eu.auth0.com/
  # Email config for local development (disabled, logs to console)
  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

auth0:
  audience: ${AUTH0_AUDIENCE:https://numbers-dont-lie-api}
app:
  jwt:
    access-token-expiry-minutes: 15
    issuer: numbers-dont-lie
  two-factor:
    issuer: NumbersDontLie
  email:
    # In local dev, email is disabled so codes appear in console logs
    enabled: false
    from-address: noreply@numbersdontlie.app
    from-name: Numbers Don't Lie
    # Frontend URL for verification links (used in email)
    frontend-url: http://localhost:5173
